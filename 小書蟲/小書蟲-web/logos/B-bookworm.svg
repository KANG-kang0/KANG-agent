<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 米白底，可愛派 -->
  <rect width="512" height="512" fill="#fdf8f2" rx="96"/>
  <!-- 書本（豎著放，書蟲從書頁鑽出） -->
  <g transform="translate(75, 135)">
    <!-- 書本外殼 -->
    <rect x="0" y="0" width="280" height="245" rx="10" fill="#8b5a3c"/>
    <!-- 內頁 -->
    <rect x="14" y="14" width="252" height="217" rx="4" fill="#fdf8f2"/>
    <!-- 中間摺痕（裝訂線） -->
    <line x1="140" y1="14" x2="140" y2="231" stroke="#d4a87f" stroke-width="2"/>
    <!-- 左頁文字 -->
    <rect x="32" y="40" width="80" height="9" rx="4.5" fill="#d4a87f"/>
    <rect x="32" y="58" width="92" height="9" rx="4.5" fill="#d4a87f"/>
    <rect x="32" y="76" width="70" height="9" rx="4.5" fill="#d4a87f"/>
    <rect x="32" y="110" width="92" height="9" rx="4.5" fill="#d4a87f"/>
    <rect x="32" y="128" width="82" height="9" rx="4.5" fill="#d4a87f"/>
    <!-- 右頁文字 -->
    <rect x="156" y="40" width="92" height="9" rx="4.5" fill="#d4a87f"/>
    <rect x="156" y="58" width="80" height="9" rx="4.5" fill="#d4a87f"/>
    <rect x="156" y="76" width="92" height="9" rx="4.5" fill="#d4a87f"/>
  </g>
  <!-- 書蟲（從書本右上探頭出來，帶笑） -->
  <g transform="translate(355, 175)">
    <!-- 身體 -->
    <ellipse cx="0" cy="0" rx="46" ry="42" fill="#7a4828"/>
    <!-- 高光 -->
    <ellipse cx="-12" cy="-15" rx="14" ry="8" fill="#a8693c" opacity="0.5"/>
    <!-- 左眼 -->
    <circle cx="-15" cy="-6" r="9" fill="#fdf8f2"/>
    <circle cx="-13" cy="-4" r="5" fill="#2d1e10"/>
    <circle cx="-12" cy="-6" r="1.5" fill="#fdf8f2"/>
    <!-- 右眼 -->
    <circle cx="15" cy="-6" r="9" fill="#fdf8f2"/>
    <circle cx="17" cy="-4" r="5" fill="#2d1e10"/>
    <circle cx="18" cy="-6" r="1.5" fill="#fdf8f2"/>
    <!-- 微笑 -->
    <path d="M -12 14 Q 0 26 12 14" stroke="#2d1e10" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- 兩根觸角 -->
    <path d="M -10 -38 Q -16 -50 -22 -54" stroke="#7a4828" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 10 -38 Q 16 -50 22 -54" stroke="#7a4828" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="-22" cy="-54" r="4.5" fill="#7a4828"/>
    <circle cx="22" cy="-54" r="4.5" fill="#7a4828"/>
  </g>
</svg>
